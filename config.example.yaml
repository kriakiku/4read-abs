# 4read-abs configuration.
#
# Secrets belong in environment variables, not here: ABS_URL, ABS_API_KEY,
# FLARESOLVERR_URL all override whatever this file says.
# Copy to config.yaml (or point CONFIG_FILE at it) and edit.
#
# The web editor omits unused keys and values that match defaults — only
# overrides need to appear here.

logLevel: info

server:
  # There is no authentication, so do not bind this to a public interface.
  host: 127.0.0.1
  port: 8480

paths:
  data: ./data
  # Books are assembled here first, then linked/copied into the library.
  staging: ./staging
  # The Audiobookshelf library as this process sees it. Required so Accept can create folders.
  absLibrary: ""

source:
  baseUrl: https://4read.org
  # Cloudflare on this source reacts to burst volume. The limiter starts here and
  # backs off automatically when it gets challenged.
  minIntervalMs: 5000
  maxIntervalMs: 120000
  challengeCooldownMs: 600000
  requestTimeoutMs: 45000

flaresolverr:
  # e.g. http://127.0.0.1:8191/v1 - without it, crawling stops at the first challenge.
  url: ""
  # auto: try a plain request first and escalate on a challenge
  # always: send everything through FlareSolverr
  # never: never use it
  mode: auto
  maxTimeoutMs: 180000
  useSession: true

audiobookshelf:
  url: ""
  apiKey: ""
  # Empty means every book library.
  libraryIds: []
  # Audiobookshelf reports container paths; map them to what this process can see.
  pathMappings: []
  #  - from: /audiobooks
  #    to: /library
  triggerScan: true
  # Rewrites tags inside the audio files. Off by default because it modifies media.
  embedIntoAudioFiles: false

audio:
  # Accept/sync requests {source.baseUrl}/m33u2/{id}-{slug}.m3u and downloads listed mp3s
  # (article basename without .html, e.g. 5546-garri-garrison-stalevyj-schur-2025-mp3).
  # into the book folder (via Fetcher / FlareSolverr; soft-fail if missing).
  playlistTimeoutMs: 30000
  # Per mp3 on reasd.org. 4h chapter @ 128kbps ≈ 230MB — 10m is often too short on slow links.
  # ENV: AUDIO_TRACK_TIMEOUT_MS
  trackTimeoutMs: 3600000
  # Parallel CDN mp3 downloads within one book (ENV: AUDIO_TRACK_CONCURRENCY).
  trackConcurrency: 5
  minFileBytes: 1024

sync:
  # fill-empty     - only fill fields Audiobookshelf left empty
  # overwrite-ours - replace what we wrote before, keep manual edits (default)
  # overwrite-all  - always write our values
  writePolicy: overwrite-ours
  # Accept creates a folder with metadata, cover, and audio for books not in the library yet.
  folderTemplate: "{author}/{series}/{title}"
  # Media files are hardlinked; metadata files are always copied.
  linkMode: hardlink
  onCrossDevice: copy
  language: ukr
  tagPrefix: "4read"
  matchThreshold: 0.86

narrators:
  # Ordered by preference: the first match wins when a book exists in several readings.
  prefer: []
  #  - Характерник
  #  - Ада Роговцева
  block: []

subscriptions: []
#  - type: series
#    value: "all the young dudes"
#  - type: author
#    value: "Агата Крісті"
#  - type: narrator
#    value: "Характерник"
#  - type: genre
#    value: fentezi
#    enabled: false

schedule:
  # Sitemap poll interval in minutes; 0 disables it.
  incrementalMinutes: 60
  backfillEnabled: true
  # Detail pages per tick — only for subscription matches and the news queue.
  backfillBatch: 25
  syncMinutes: 180
