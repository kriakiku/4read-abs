name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun test

      - name: Resolve version
        id: version
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # amd64 only, as a single self-contained executable with Bun baked in.
      - name: Build linux-x64 binary
        run: |
          bun build --compile --target=bun-linux-x64 --minify \
            ./src/index.ts --outfile dist/4read-abs-linux-amd64

      - name: Package
        working-directory: dist
        run: |
          cp ../config.example.yaml .
          cp ../README.md .
          tar -czf 4read-abs-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz \
            4read-abs-linux-amd64 config.example.yaml README.md
          sha256sum 4read-abs-linux-amd64 \
            4read-abs-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: 4read-abs-linux-amd64
          path: |
            dist/4read-abs-linux-amd64
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/4read-abs-linux-amd64
            dist/*.tar.gz
            dist/SHA256SUMS
