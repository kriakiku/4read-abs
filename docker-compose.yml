services:
  4read-abs:
    # Published by .github/workflows/container.yml on v* tags.
    image: ghcr.io/kriakiku/4read-abs:latest
    # Uncomment to build from this checkout instead of pulling GHCR:
    # build: .
    restart: unless-stopped
    depends_on:
      - flaresolverr
    ports:
      # No authentication: keep this on the loopback interface.
      - "127.0.0.1:8480:8480"
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      FLARESOLVERR_MODE: auto
      ABS_URL: ${ABS_URL:-}
      ABS_API_KEY: ${ABS_API_KEY:-}
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY:-}
      ABS_LIBRARY_DIR: /library
      LOG_LEVEL: info
    volumes:
      - ./config:/config
      - ./data:/data
      # Books are assembled here first, then hardlinked into the library. Keep this on the
      # same filesystem as the library or hardlinks fall back to copies.
      - ./staging:/staging
      # The same audiobook library Audiobookshelf uses. Must be writable.
      - /srv/audiobooks:/library

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: warning
      TZ: Europe/Kyiv
    # Only 4read-abs needs to reach it, so no host port is published.
    expose:
      - "8191"
